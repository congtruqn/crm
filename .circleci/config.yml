version: 2.1

jobs:
  deploy-dev:
    machine:
      image: ubuntu-2204:2023.07.2
    steps:
      - run:
          name: Deploy Over SSH
          command: |
            echo ${CIRCLE_BRANCH}
            ssh root@103.146.22.152 "cd /opt/develop/crm/; git pull origin develop; yarn build"

  deploy-pro:
    machine:
      image: ubuntu-2204:2024.05.1
    steps:
      - run:
          name: Deploy Over SSH
          command: |
            echo ${CIRCLE_BRANCH}
            ssh root@103.146.22.152 "cd ${APP_PRODUCT_DIR}; git pull origin ${CIRCLE_BRANCH}; yarn build"

workflows:
  deploy-develop:
    jobs:
      - deploy-dev:
          filters:
            branches:
              only: develop # only deploy on the main branch

  deploy-production:
    jobs:
      - deploy-pro:
          filters:
            branches:
              only: main # only deploy on the main branch